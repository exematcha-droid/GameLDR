<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LDR Game Night 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece6ff;--pk:#ff6b8b;--yl:#ffd65a;--mn:#7fe0c0;--bl:#8ecbff;--ink:#3b2a4a}
*{box-sizing:border-box;font-family:Fredoka,system-ui,sans-serif}
body{margin:0;background:var(--bg) radial-gradient(#d6cbff 2px,transparent 2px) 0 0/22px 22px;color:var(--ink);min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:14px 12px 60px}
h1{font-size:2.1rem;margin:.2em 0;text-align:center;line-height:1.05}
.wig{display:inline-block;animation:wig 1.6s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(12deg) scale(1.15)}}
.box{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);padding:14px;margin:12px 0}
button,input{font-size:1rem;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;color:var(--ink)}
button{background:var(--yl);font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:.1s}
button:active{transform:translate(3px,3px);box-shadow:none}
button:focus-visible,input:focus-visible{outline:3px dashed var(--pk);outline-offset:2px}
button.pk{background:var(--pk)}button.mn{background:var(--mn)}button.bl{background:var(--bl)}
button:disabled{opacity:.4;cursor:not-allowed}
input{width:100%;margin:5px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gm{padding:20px 8px;font-size:1.15rem;line-height:1.3}
.tb{text-align:center;display:grid;gap:8px}
.hint{text-align:center;font-size:.8rem}
.dice{font-size:2.6rem;line-height:1}
.sb,.mb{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px}
.sb{--n:6}.mb{--n:5;grid-template-rows:repeat(5,1fr)}
.c,.mc{aspect-ratio:1;border:2px solid var(--ink);border-radius:10px;background:#fff;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
.c{font-size:.6rem}.c b{position:absolute;top:2px;left:4px}.c .e{font-size:1.2rem}
.mc{font-size:.8rem;gap:1px}.mc small{font-size:.5rem}
.pw{position:absolute;bottom:0;font-size:1.3rem;animation:hop 1s infinite}.p0{left:1px}.p1{right:1px}
@keyframes hop{50%{transform:translateY(-4px)}}
.mid{grid-area:2/2/5/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#ffffff99;border-radius:14px;font-size:.85rem;text-align:center;padding:4px}
.mid button{padding:6px 10px;font-size:.8rem}
.hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.uc{width:54px;height:80px;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;text-align:center;font-size:1.4rem;font-weight:700;color:#fff;text-shadow:1px 1px 0 var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer;line-height:1.1}
.uc.off{opacity:.4}.uc.back{background:#fff;color:var(--ink);text-shadow:none;font-size:.8rem}
.dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink)}
.md{position:fixed;inset:0;background:#3b2a4acc;display:grid;place-items:center;padding:16px;z-index:9}
.qc{background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--pk);padding:20px;max-width:380px;width:100%;text-align:center;animation:pop .35s}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.qh{font-weight:700;font-size:1.35rem;color:var(--pk)}.qs{font-size:.8rem;margin-bottom:6px}
.qn{display:inline-block;background:var(--yl);border:2px solid var(--ink);border-radius:20px;padding:0 10px;font-size:.8rem}
.id{font-size:1.35rem;font-weight:700;margin:12px 0 6px}
.en{font-style:italic;text-decoration:underline;text-decoration-color:var(--pk);text-decoration-thickness:3px;text-underline-offset:5px;margin:8px 0 16px}
.fl{position:fixed;bottom:0;font-size:2rem;animation:up 2s ease-out forwards;z-index:20;pointer-events:none}
@keyframes up{to{transform:translateY(-80vh) rotate(20deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div>
<script>
const Q=`Apa mimpi terbesarmu?|What is your biggest dream?
Apa kenangan masa kecil favoritmu?|What is your favorite childhood memory?
Kapan pertama kali kamu merasa jatuh cinta padaku?|When did you first fall for me?
Apa yang paling kamu rindukan dariku saat jauh?|What do you miss most about me when we're apart?
Apa ketakutan terbesarmu?|What is your biggest fear?
Makanan apa yang bikin kamu bahagia?|What food makes you happy?
Apa kesan pertamamu tentangku?|What was your first impression of me?
Hal kecil apa yang bikin harimu lebih baik?|What small thing makes your day better?
Kalau bisa teleport sekarang, kamu mau ke mana bersamaku?|If you could teleport now, where would we go together?
Apa kebiasaan anehmu yang belum kuketahui?|What's a weird habit of yours I don't know yet?
Lagu apa yang mengingatkanmu padaku?|Which song reminds you of me?
Apa hal paling berani yang pernah kamu lakukan?|What is the bravest thing you've ever done?
Bagaimana bayangan hari tua kita?|How do you picture us when we're old?
Apa yang paling kamu syukuri hari ini?|What are you most grateful for today?

Apa momen paling memalukan dalam hidupmu?|What's your most embarrassing moment?
Apa bahasa cintamu?|What is your love language?

Apa pelajaran hidup terpentingmu?|What's the most important life lesson you've learned?
Siapa orang yang paling berpengaruh dalam hidupmu?|Who has influenced your life the most?
Apa yang ingin kamu ubah dari dirimu?|What would you like to change about yourself?
Apa liburan impianmu?|What is your dream vacation?
Apa yang bikin kamu cemburu?|What makes you jealous?
Kapan terakhir kali kamu menangis, dan kenapa?|When did you last cry, and why?
Apa panggilan sayang favoritmu untukku?|What's your favorite nickname for me?
Apa hal paling romantis yang pernah kamu lakukan?|What's the most romantic thing you've ever done?
Seperti apa rumah impian kita?|What does our dream home look like?
Kamu lebih suka pagi atau malam? Kenapa?|Morning or night person? Why?
Apa hobi yang ingin kamu coba bersamaku?|What hobby do you want to try with me?
Apa yang kamu pelajari dari hubungan LDR kita?|What have you learned from our long-distance relationship?
Apa hal tersulit dari LDR menurutmu?|What's the hardest part of LDR for you?
Apa hal terbaik dari LDR kita?|What's the best part of our LDR?

Apa yang kamu pikirkan sebelum tidur?|What do you think about before sleeping?
Siapa tokoh fiksi yang paling mirip denganmu?|Which fictional character is most like you?
Kekuatan super apa yang kamu mau?|What superpower would you want?
Apa yang bikin kamu tertawa terbahak-bahak?|What makes you laugh out loud?
Hal apa dariku yang bikin kamu gemas?|What do I do that you find adorable?
Apa rahasia kecil yang belum pernah kamu ceritakan?|What little secret have you never told anyone?
Pencapaian apa yang paling kamu banggakan?|What achievement are you proudest of?
Bagaimana caramu menghadapi stres?|How do you deal with stress?
Apa yang kamu butuhkan saat sedang sedih?|What do you need when you're sad?
Kalau menang lotre, apa yang pertama kamu beli?|If you won the lottery, what would you buy first?
Nilai hidup apa yang paling penting bagimu?|What value matters most to you in life?
Apa yang bikin kamu tertarik padaku?|What attracted you to me?
Tempat mana yang bikin kamu merasa paling tenang?|Where do you feel most at peace?
Apa yang ingin kamu ucapkan tapi belum sempat?|What have you wanted to say but haven't yet?
Seperti apa pernikahan impianmu?|What does your dream wedding look like?
Berapa anak dan hewan peliharaan yang kamu mau?|How many kids and pets do you want?
Siapa nama anak kita nanti?|What would we name our kids?
Apa kebiasaanku yang paling kamu suka?|What habit of mine do you like the most?
Apa kebiasaanku yang kadang bikin kamu kesal?|What habit of mine sometimes annoys you?
Kapan kamu merasa paling dekat denganku?|When did you feel closest to me?
Seperti apa kencan virtual paling seru versimu?|What's your idea of the best virtual date?
Kata-kata apa yang ingin sering kamu dengar dariku?|What words do you want to hear from me more often?
Apa kenangan favoritmu tentang kita?|What's your favorite memory of us?
Di mana kamu melihat dirimu 5 tahun lagi?|Where do you see yourself in 5 years?
Apa hal yang paling kamu sesali?|What is something you regret?
Siapa sahabat terbaikmu dan kenapa?|Who is your best friend and why?
Seperti apa akhir pekan idealmu?|What does your perfect weekend look like?
Apa kelemahan terbesarmu?|What is your biggest weakness?
Apa kelebihan terbesarmu menurutmu?|What do you think is your greatest strength?
Hewan apa yang menggambarkan dirimu?|Which animal describes you best?
Apa hal teraneh yang pernah kamu makan?|What's the weirdest thing you've eaten?
Apa cita-cita masa kecilmu?|What did you want to be as a kid?
Bagaimana cara kita menyelesaikan masalah dengan baik?|How can we best solve problems together?
Apa yang membuatmu merasa aman bersamaku?|What makes you feel safe with me?
Apa yang bikin kamu ragu dalam hubungan ini?|What makes you doubt things in this relationship?
Apa yang kamu harap lebih sering kulakukan?|What do you wish I did more?
Kapan kamu merasa bangga padaku?|When have you been proud of me?
Kejutan apa yang ingin kamu berikan padaku?|What surprise would you love to give me?
Apa kado terbaik yang pernah kamu terima?|What's the best gift you've ever received?
Apa yang ingin kamu lakukan sebelum umur 40?|What do you want to do before you turn 40?

Kota mana yang ingin kita tinggali bersama?|Which city would you like us to live in?
Apa yang bikin kamu insecure?|What makes you feel insecure?
Apa yang kamu lakukan saat kangen aku?|What do you do when you miss me?
Apa mimpi teraneh yang pernah kamu alami?|What's the strangest dream you've had?
Tradisi apa yang ingin kita buat berdua?|What tradition do you want us to create?
Masakan apa yang ingin kamu buat bersamaku?|What dish do you want to cook together?
Lagu apa yang ingin kamu nyanyikan untukku?|What song would you sing for me?
Apa hal paling gila yang ingin kamu lakukan bersamaku?|What's the craziest thing you want to do with me?
Bagaimana kamu ingin dikenang?|How do you want to be remembered?
Apa buku atau serial favoritmu?|What's your favorite book or series?
Apa yang kamu pelajari dari kegagalan?|What have you learned from failure?
Pertengkaran kita yang mana yang paling kamu ingat?|Which argument of ours do you remember most?
Apa yang bikin kamu bersyukur punya aku?|What makes you grateful to have me?
Apa tiga kata yang menggambarkan hubungan kita?|What three words describe our relationship?
Apa yang ingin kamu perbaiki dalam hubungan kita?|What would you improve in our relationship?
Apa yang kamu lakukan pertama kali saat bangun tidur?|What do you do first when you wake up?
Apa rahasia kebahagiaan menurutmu?|What's the secret to happiness in your opinion?
Janji kecil apa yang ingin kamu buat untukku?|What small promise do you want to make to me?
Siapa yang lebih sabar di antara kita?|Which of us is more patient?
Sifatku yang mana yang ingin kamu tiru?|Which of my traits do you admire?
Apa yang kamu bayangkan saat kita bertemu lagi?|What do you imagine for our next reunion?
Apa yang paling bikin kamu rindu rumah?|What do you miss most about home?
Bagaimana kamu ingin merayakan ulang tahun hubungan kita?|How do you want to celebrate our anniversary?
Apa harapanmu untuk kita setahun ke depan?|What do you hope for us in the next year?
Apa yang ingin kamu katakan padaku sekarang?|What do you want to tell me right now?`.split("\n").map(l=>l.split("|"));

const $=document.getElementById("app"),E=["🐰","🐻"],DI="⚀⚁⚂⚃⚄⚅",rnd=n=>Math.floor(Math.random()*n);
let st=null,me=0,room="",local=false,name="",err="",rolling=false,seenRx=0;
const fresh=()=>({v:0,g:"menu",turn:0,names:[name||"Kamu","Doi"],used:[],q:null,msg:"",rx:null,win:null});
const api=(m,b)=>fetch("/api?room="+room,{method:m,body:b&&JSON.stringify(b)}).then(r=>r.json());
async function commit(){st.v++;render();if(!local){try{await api("POST",st)}catch(e){}}}
setInterval(async()=>{if(local||!room||!st)return;try{const r=await api("GET");if(r&&r.v>st.v){st=r;render()}}catch(e){}},1500);
const can=()=>(local||me===st.turn)&&st.q==null&&st.win==null;
const nm=()=>document.getElementById("nm").value.trim();

/* ---------- HOME ---------- */
const home=()=>`<h1><span class=wig>💕</span> LDR Game Night <span class=wig>🎲</span></h1>
<p style="text-align:center">Beda kota, tetap bisa main bareng ✈️</p>
<div class=box><input id=nm placeholder="Nama kamu" value="${name}">
<button class=pk onclick="mk()" style="width:100%;margin:6px 0">✨ Buat room baru</button>
<input id=cd placeholder="Kode room dari pasanganmu" maxlength=6 style="text-transform:uppercase">
<button class=mn onclick="jn()" style="width:100%;margin:6px 0">💌 Gabung room</button>
<button class=bl onclick="lc()" style="width:100%">📱 Main berdua di 1 HP</button>
<p>${err}</p></div>`;
function mk(){name=nm();room=[...Array(4)].map(()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[rnd(24)]).join("");me=0;local=false;st=fresh();commit()}
async function jn(){name=nm();room=document.getElementById("cd").value.trim().toUpperCase();if(!room)return;
 try{const r=await api("GET");if(!r)throw 0;st=r;me=1;local=false;st.names[1]=name||"Doi";commit()}catch(e){err="Room nggak ketemu 🥲 cek lagi kodenya ya";render()}}
function lc(){name=nm();local=true;st=fresh();render()}

/* ---------- COMMON ---------- */
const turnbar=x=>`<div class="box tb">${st.msg?`<div>${st.msg}</div>`:""}<b>${E[st.turn]} Giliran ${st.names[st.turn]}${can()&&!local?" (kamu!) ✨":""}</b><div class=row>${x}</div></div>`;
const qcard=i=>`<div class=md><div class=qc><div class=qh>💕 COUPLE CARD GAME 💕</div><div class=qs>100 Questions to Know Each Other Deeper</div><span class=qn>#${i+1}</span><p class=id>${Q[i][0]}</p><p class=en>${Q[i][1]}</p><button class=pk onclick="st.q=null;commit()">Udah dijawab ✔️</button></div></div>`;
const winbox=()=>`<div class=md><div class=qc><h1>🎉🏆🎉</h1><h2>${st.names[st.win]} menang!</h2><p>Yang kalah traktir boba ya 🧋</p><button class=pk onclick="go('menu')">Balik ke menu</button></div></div>`;
function qask(){let l=Q.map((_,i)=>i).filter(i=>!st.used.includes(i));if(!l.length){st.used=[];l=Q.map((_,i)=>i)}const i=l[rnd(l.length)];st.used.push(i);st.q=i}
function ask(){qask();commit()}
function win(t){st.win=t;commit()}
function roll(fn){if(rolling)return;rolling=true;let n=0;const iv=setInterval(()=>{const d=document.getElementById("dc");if(d)d.textContent=DI[rnd(6)];if(++n>8){clearInterval(iv);rolling=false;fn(1+rnd(6))}},70)}
function react(e){st.rx={e,id:Date.now()};commit()}
function fl(e){for(let i=0;i<8;i++){const s=document.createElement("span");s.textContent=e;s.className="fl";s.style.left=10+rnd(80)+"%";s.style.animationDelay=i*.1+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}}
function go(g){st.g=g;st.turn=0;st.win=null;st.q=null;st.msg="";
 if(g=="snake")st.p=[1,1];
 if(g=="mono"){st.p=[0,0];st.cash=[1000,1000];st.own={};st.buy=null}
 if(g=="uno")initUno();
 commit()}
const menu=()=>`<h1 style="font-size:1.6rem">Mau main apa hari ini?</h1><div class=grid2>
<button class="gm pk" onclick="go('snake')">🐍🪜<br>Ular Tangga</button>
<button class="gm mn" onclick="go('mono')">🏠💰<br>Monopoli Mini</button>
<button class="gm bl" onclick="go('uno')">🃏<br>UNO</button>
<button class=gm onclick="ask()">💌<br>Couple Card</button></div>
<p class=hint>${local?"Mode 1 HP: gantian pegang ya 🤝":"Bagikan kode room <b>"+room+"</b> ke pasanganmu 💞"}</p>`;

/* ---------- ULAR TANGGA ---------- */
const SN={16:6,27:11,32:19,35:24},LD={3:13,8:21,18:29,22:33},SQ=[5,10,14,20,26,30];
function snake(){let c="";for(let r=5;r>=0;r--)for(let k=0;k<6;k++){const n=r*6+(r%2?6-k:k+1);
 const e=SN[n]?"🐍":LD[n]?"🪜":SQ.includes(n)?"💌":n==36?"🏆":"";
 const bg=SN[n]?"#ffd0d9":LD[n]?"#c9f5e6":SQ.includes(n)?"#fff1b8":"#fff";
 c+=`<div class=c style="background:${bg}"><b>${n}</b><span class=e>${e}</span>${st.p.map((p,i)=>p==n?`<span class="pw p${i}">${E[i]}</span>`:"").join("")}</div>`}
 return `<div class=sb>${c}</div>`+turnbar(`<span id=dc class=dice>${DI[(st.d||1)-1]}</span><button class=pk ${can()?"":"disabled"} onclick="sroll()">Kocok dadu 🎲</button>`)+`<p class=hint>🐍 turun · 🪜 naik · 💌 kartu pertanyaan</p>`}
function sroll(){if(!can())return;roll(d=>{const t=st.turn;let p=st.p[t]+d;st.d=d;if(p>36)p=72-p;
 st.msg=`${st.names[t]} dapat ${d}`;
 if(p==36){st.p[t]=36;return win(t)}
 if(SN[p]){p=SN[p];st.msg+=" · 🐍 digigit ular!"}else if(LD[p]){p=LD[p];st.msg+=" · 🪜 naik tangga!"}
 st.p[t]=p;st.turn=1-t;if(SQ.includes(p))qask();commit()})}

/* ---------- MONOPOLI ---------- */
const T=`🏁|START|0|s
🍜|Warung Bakso|60|p
💌|Kartu Tanya|0|q
☕|Kafe Kopi|80|p
🎬|Bioskop|100|p
🧾|Pajak -50|0|t
🌳|Taman Kota|120|p
💌|Kartu Tanya|0|q
🏖️|Pantai|140|p
🛍️|Mall|160|p
💌|Kartu Tanya|0|q
🎁|Bonus +50|0|b
🏢|Apartemen|180|p
🏨|Hotel|200|p
💌|Kartu Tanya|0|q
✈️|Bandara|220|p`.split("\n").map(l=>{const a=l.split("|");return{e:a[0],n:a[1],p:+a[2],t:a[3]}});
const POS=i=>i<5?[1,i+1]:i<8?[i-3,5]:i<13?[5,13-i]:[17-i,1];
function mono(){const c=T.map((t,i)=>{const[r,k]=POS(i),o=st.own[i];
 return `<div class=mc style="grid-area:${r}/${k};${o!=null?"background:"+(o?"#ffd0d9":"#cfeaff"):""}"><span>${t.e}</span><small>${t.n}</small>${t.p?`<small>${o!=null?E[o]:"$"+t.p}</small>`:""}${st.p.map((p,j)=>p==i?`<span class="pw p${j}">${E[j]}</span>`:"").join("")}</div>`}).join("");
 const b=st.buy,ui=b!=null?(can()?`<div>Beli ${T[b].n} $${T[b].p}?</div><div class=row><button class=mn onclick="buy(1)">Beli 🏠</button><button onclick="buy(0)">Skip</button></div>`:"<div>Lagi mikir mau beli... 🤔</div>"):`<button class=pk ${can()?"":"disabled"} onclick="mroll()">Kocok 🎲</button>`;
 return `<div class=mb>${c}<div class=mid>${st.names.map((n,i)=>`<div>${E[i]} $${st.cash[i]}</div>`).join("")}<span id=dc class=dice>${DI[(st.d||1)-1]}</span>${ui}</div></div>`+turnbar(`<button onclick="fin()">Akhiri game</button>`)+`<p class=hint>Lewat START +$200 · sewa = 30% harga</p>`}
function nextT(){if(st.cash[st.turn]<0)return win(1-st.turn);st.turn=1-st.turn;commit()}
function mroll(){if(!can()||st.buy!=null)return;roll(d=>{const t=st.turn,o=st.p[t],n=(o+d)%16,x=T[n],ow=st.own[n];st.d=d;st.p[t]=n;st.msg=`${st.names[t]} dapat ${d}`;
 if(n<o){st.cash[t]+=200;st.msg+=" · lewat START +$200"}
 if(x.t=="p"){if(ow==null){st.buy=n;return commit()}if(ow!=t){const r=Math.round(x.p*.3);st.cash[t]-=r;st.cash[ow]+=r;st.msg+=` · bayar sewa $${r}`}}
 else if(x.t=="q")qask();else if(x.t=="t")st.cash[t]-=50;else if(x.t=="b")st.cash[t]+=50;
 nextT()})}
function buy(y){const t=st.turn,b=st.buy;if(y&&st.cash[t]>=T[b].p){st.cash[t]-=T[b].p;st.own[b]=t;st.msg=`${st.names[t]} beli ${T[b].n} 🏠`}st.buy=null;nextT()}
function fin(){const w=[0,1].map(i=>st.cash[i]+Object.keys(st.own).filter(k=>st.own[k]==i).reduce((s,k)=>s+T[k].p,0));win(w[0]>=w[1]?0:1)}

/* ---------- UNO ---------- */
const CL={r:"#ff6b8b",y:"#ffb800",g:"#3fc79a",b:"#5aa9f0",w:"#3b2a4a"};
function initUno(){const d=[];for(const c of"rygb"){for(let v=1;v<=9;v++)d.push({c,v:""+v},{c,v:""+v});d.push({c,v:"S"},{c,v:"S"},{c,v:"+2"},{c,v:"+2"})}
 for(let i=0;i<4;i++)d.push({c:"w",v:"W"},{c:"w",v:"+4"});
 d.sort(()=>Math.random()-.5);st.h=[d.splice(0,7),d.splice(0,7)];let t;do{t=d.pop();if(t.c=="w")d.unshift(t)}while(t.c=="w");st.top=t;st.col=t.c;st.dk=d;st.wild=0}
const ok=x=>x.c=="w"||x.c==st.col||x.v==st.top.v;
const dr=(p,n)=>{while(n--)st.h[p].push(st.dk.length?st.dk.pop():{c:"rygb"[rnd(4)],v:""+(1+rnd(9))})};
function uno(){const v=local?st.turn:me,my=can(),o=1-v;
 const cd=(x,k,f)=>`<div class="uc ${k}" style="background:${CL[x.c]}" ${f||""}>${x.v=="S"?"⛔":x.v=="W"?"🌈":x.v}</div>`;
 const pick=st.wild&&my?`<div class=row><span>Pilih warna:</span>${[..."rygb"].map(c=>`<button style="background:${CL[c]}" onclick="wild('${c}')">●</button>`).join("")}</div>`:"";
 return `<div class="box tb"><div>${local?"Kartu lawan disembunyikan, oper HP tiap giliran 🙈":`${E[o]} ${st.names[o]}: ${st.h[o].length} kartu`}</div>
 <div class=row><div class="uc back" onclick="drw()">🂠<br>ambil</div>${cd(st.top,"")}<span class=dot style="background:${CL[st.col]}"></span></div></div>`
 +turnbar(pick)+`<div class=hand>${st.h[v].map((x,i)=>cd(x,my&&!st.wild&&ok(x)?"":"off",`onclick="play(${i})"`)).join("")}</div><p class=hint>⛔ skip + kartu pertanyaan · 🌈 ganti warna</p>`}
function play(i){if(!can()||st.wild)return;const t=st.turn,x=st.h[t][i];if(!ok(x))return;st.h[t].splice(i,1);st.top=x;
 if(!st.h[t].length)return win(t);
 if(x.c=="w"){st.wild=1;return commit()}
 st.col=x.c;eff(x)}
function wild(c){st.col=c;st.wild=0;eff(st.top)}
function eff(x){const t=st.turn,o=1-t;st.msg=`${st.names[t]} main ${x.v}`;
 if(x.v=="+2")dr(o,2);else if(x.v=="+4")dr(o,4);else if(x.v=="S")qask();
 if(!["S","+2","+4"].includes(x.v))st.turn=o;
 if(st.h[t].length==1)st.msg+=" · UNO! 🔔";
 commit()}
function drw(){if(!can()||st.wild)return;dr(st.turn,1);st.msg=`${st.names[st.turn]} ambil kartu`;st.turn=1-st.turn;commit()}

/* ---------- RENDER ---------- */
function render(){
 if(!st){$.innerHTML=home();return}
 let h=`<div class=box style="display:flex;justify-content:space-between;padding:8px 12px"><span>${local?"📱 1 HP":"🔑 "+room}</span><span>${E[0]} ${st.names[0]} · ${E[1]} ${st.names[1]}</span></div>`;
 h+=st.g=="menu"?menu():st.g=="snake"?snake():st.g=="mono"?mono():uno();
 h+=`<div class=row style="margin-top:14px">${st.g!="menu"?`<button onclick="go('menu')">🏠 Menu</button>`:""}${["😘","😂","🥺","😡","❤️"].map(e=>`<button onclick="react('${e}')">${e}</button>`).join("")}</div>`;
 if(st.q!=null)h+=qcard(st.q);
 if(st.win!=null)h+=winbox();
 $.innerHTML=h;
 if(st.rx&&st.rx.id!=seenRx){seenRx=st.rx.id;fl(st.rx.e)}
}
render();
</script></body></html>
