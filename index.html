body{background:radial-gradient(#d6cbff 2px,transparent 2px) 0 0/22px 22px,linear-gradient(180deg,#e7defe,#fde4ef 55%,#dff2ff) fixed}

#dock{left:50%;right:auto;transform:translateX(-50%);bottom:8px;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:26px;padding:6px 10px;box-shadow:0 5px 0 var(--ink)}

.pan{right:auto;left:50%;transform:translateX(-50%);bottom:96px;width:min(94vw,380px);max-height:68vh;overflow:auto}

</style></head><body><div id="app"></div>
<div id=bgl></div><div id=toast></div>
<div id=dock>
<button class=dk id=bsnd data-p=snd onclick="tp('snd')"><img class=ic src=img/speaker.png alt=""><span>Suara</span></button>

<div class=row><input id=ci maxlength=120 placeholder="Tulis pesan manis..." onkeydown="if(event.key=='Enter')sendC()"><button class=pk onclick="sendC()"><img class=ic src=img/send.png alt=""></button></div></div>

<div class=vrow><div id=vp0></div><div id=vp1></div></div><p class=hint id=vst>Voice mati</p>
<div class=row><button id=vb class=mn onclick="VC.tog()"></button><button id=vm class=bl onclick="VC.mute()" hidden></button></div>
<label class=sl>Volume suara pasangan<input type=range id=vvol min=0 max=1 step=.05 oninput="VC.vol(+this.value)"></label>
<p class=hint>Kalian berdua harus menyalakan voice. Izinkan akses mikrofon saat diminta.</p></div>
<script src="questions.js"></script>
<script>
const $=document.getElementById("app"),DI="⚀⚁⚂⚃⚄⚅",rnd=n=>Math.floor(Math.random()*n);
let st=null,me=0,room="",pw="",local=false,err="",rolling=false,seenRx=0,prof=null,tmp=null;
const esc=s=>String(s).replace(/[&<>"'`]/g,"");
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};

const ic=(n,c="")=>`<img class="ic ${c}" src="img/${n}.png" alt="">`;
const EM={"💕":"heart","❤":"heart","💞":"hearts","👾":"mascot","🎲":"dice","💬":"chat","🔊":"speaker","🔇":"mute","➤":"send","🐍":"snake","🪜":"ladder","💌":"letter","🏆":"trophy","🏠":"house","💰":"coin","🃏":"cards","🔑":"key","⏳":"hourglass","📱":"phone","🤝":"hands","🙈":"monkey","🤔":"think","✔":"check","⛔":"skip","🌈":"rainbow","🂠":"cardback","✨":"sparkle","🔔":"bell","😘":"kiss","😂":"laugh","🥺":"plead","😡":"angry","🥲":"cry","🚪":"door","✏":"pencil","🎉":"party","🔒":"lock","🗑":"trash","👋":"wave","👻":"ghost","🎁":"gift","🧾":"receipt","🏁":"flag","🍜":"bakso","☕":"coffee","🎬":"cinema","🌳":"tree","🏖":"beach","🛍":"mall","🏢":"apartment","🏨":"hotel","✈":"plane","🎡":"ferris","🍦":"icecream","🎤":"mic","🏔":"mountain","🚂":"train","🧋":"boba","🎮":"controller","⚀":"d1","⚁":"d2","⚂":"d3","⚃":"d4","⚄":"d5","⚅":"d6"};
const EMR=new RegExp("("+Object.keys(EM).join("|")+")\uFE0F?","g");
const emo=h=>String(h).replace(EMR,(m,k)=>ic(EM[k]));
/* ---------- SOUND (dibuat dari kode, tanpa file) ---------- */
const SFX=(()=>{let ac,mg,sg,mu,tm=0,nx=0,sp=0;const V={m:+(ls("ldr_vm")??.8),s:+(ls("ldr_vs")??.8),b:+(ls("ldr_vb")??.4)};let mute=!!ls("ldr_mute"),bgm=ls("ldr_bgm")!==false;
 const ap=()=>{if(!ac)return;mg.gain.value=mute?0:V.m;sg.gain.value=V.s;mu.gain.value=V.b*.45};
 const cx=()=>{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();sg=ac.createGain();mu=ac.createGain();sg.connect(mg);mu.connect(mg);mg.connect(ac.destination);ap()}if(ac.state=="suspended")ac.resume();return ac};
 const nt=(f,s,t,type,g,bus,sl)=>{const o=ac.createOscillator(),n=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,s);if(sl)o.frequency.exponentialRampToValueAtTime(sl,s+t);n.gain.setValueAtTime(.0001,s);n.gain.exponentialRampToValueAtTime(.3*g,s+.015);n.gain.exponentialRampToValueAtTime(.0001,s+t);o.connect(n);n.connect(bus);o.start(s);o.stop(s+t+.03)};
 const tone=(f,t=.12,type="sine",at=0,g=1,sl)=>{if(mute||V.m<=0||V.s<=0)return;try{cx();nt(f,ac.currentTime+at,t,type,g,sg,sl)}catch(e){}};
 const M=[5,-1,7,5,4,-1,2,3,4,-1,5,4,2,-1,0,-1,5,-1,6,5,3,-1,2,0,2,-1,3,4,6,5,3,-1],PN=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880],BS=[130.81,110,87.31,98];
 const sched=()=>{while(nx<ac.currentTime+.35){const k=M[sp];if(k>=0)nt(PN[k],nx,.28,"triangle",.5,mu);if(sp%4==0)nt(BS[sp>>3],nx,.55,"sine",.9,mu);nx+=.3125;sp=(sp+1)%32}};
 const play=()=>{if(tm||!bgm||mute)return;try{cx();nx=ac.currentTime+.1;tm=setInterval(sched,100)}catch(e){}};
 const halt=()=>{clearInterval(tm);tm=0};
 document.addEventListener("visibilitychange",()=>{if(ac)document.hidden?ac.suspend():ac.resume()});
 return{V,get mute(){return mute},get bgm(){return bgm},
  setv(k,v){V[k]=v;ls("ldr_v"+k,v);ap()},tog(){mute=!mute;ls("ldr_mute",mute);ap();mute?halt():play()},bgmTog(){bgm=!bgm;ls("ldr_bgm",bgm);bgm?play():halt()},unlock(){try{cx();play()}catch(e){}},
  pop:()=>tone(600,.08,"sine",0,.8,900),
  dice:()=>[0,1,2,3,4,5,6].forEach(i=>tone(220+rnd(300),.06,"square",i*.1,.35)),
  step:()=>tone(520,.09,"triangle",0,.8,780),
  up:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.12,"triangle",i*.08)),
  down:()=>tone(700,.5,"sawtooth",0,.6,120),
  coin:()=>{tone(988,.08,"square",0,.4);tone(1319,.25,"square",.08,.4)},
  card:()=>{tone(900,.06,"triangle",0,.7,400);tone(1200,.1,"triangle",.07,.6)},
  win:()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.18,"triangle",i*.12)),
  chat:()=>{tone(880,.08);tone(1320,.12,"sine",.09)},
  send:()=>tone(700,.07,"sine",0,.6,1000),
  turn:()=>{tone(784,.1,"triangle");tone(1047,.18,"triangle",.1)},
  join:()=>[523,659,784].forEach((f,i)=>tone(f,.14,"sine",i*.1)),
  voice:on=>on?[659,988].forEach((f,i)=>tone(f,.12,"sine",i*.1)):[988,659].forEach((f,i)=>tone(f,.12,"sine",i*.1)),
  boing:()=>tone(200,.3,"sine",0,1,700)}})();
let pq=null,pwn=null,psig=null,chat=[],seenC=0,pt=null,pn=0;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

/* ---------- CHAT ---------- */
const STK=["heart","kiss","laugh","plead","angry","cry","party","gift","boba","hands","wave","sparkle","star","ghost","hearts","mascot"];
function rc(){const l=document.getElementById("cl");l.innerHTML=emo(chat.map(m=>{const k=/^::(\w+)::$/.exec(m.t),s=k&&STK.includes(k[1]);return `<div class="m ${m.s==me?"me":""}"><span class=mm>${mon(m.a)}</span><div class="bb${s?" sk":""}"><small>${esc(m.n)}</small>${s?ic(k[1],"stk1"):esc(m.t)}</div></div>`}).join("")||"<p class=hint>Belum ada pesan. Sapa dulu yuk 👋</p>");l.scrollTop=l.scrollHeight}
function ub(){const p=document.getElementById("chat"),el=document.getElementById("ub");if(!p.hidden)seenC=chat.length;const n=chat.length-seenC;el.textContent=n>0?n:""}
function adoptChat(l){if(!l||l.length<chat.length)return;const add=l.slice(chat.length);chat=l;rc();if(add.some(m=>m.s!=me))SFX.chat();ub()}
function tp(id){const p=document.getElementById(id),o=p.hidden;document.querySelectorAll(".pan").forEach(x=>x.hidden=true);document.querySelectorAll("#dock .dk").forEach(b=>b.classList.remove("act"));p.hidden=!o;if(o)document.querySelector(`#dock [data-p=${id}]`).classList.add("act");if(id=="chat"&&o){ub();rc();document.getElementById("ci").focus()}if(id=="voice"&&o)VC.ui()}

/* ---------- VOICE CHAT (WebRTC, sinyal lewat /api?act=sig) ---------- */
const VC=(()=>{let on=false,stream,pc,aud,sid,peer=null,pcPeer=null,seen=new Set(),out=[],n=0,tmr,ft=0,busy=0,pend=[],mic=true,talk=[0,0];const W={};
 const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]},g=id=>document.getElementById(id);
 const flush=()=>{ft=0;return api("POST",out,"&act=sig&slot="+me).catch(()=>{})};
 const send=(t,to,d)=>{out.push({i:sid+"."+(++n),t,f:sid,to,d});if(out.length>40)out.shift();if(!ft)ft=setTimeout(flush,200)};
 const stopW=k=>{if(W[k]){clearInterval(W[k].t);W[k].c.close().catch(()=>{});W[k]=0}};
 const watch=(s,k)=>{stopW(k);try{const c=new(window.AudioContext||window.webkitAudioContext)(),a=c.createAnalyser();a.fftSize=256;c.createMediaStreamSource(s).connect(a);const b=new Uint8Array(a.frequencyBinCount);W[k]={c,t:setInterval(()=>{a.getByteFrequencyData(b);let m=0;for(const x of b)m+=x;const v=m/b.length>14?1:0;if(v!==talk[k]){talk[k]=v;ui()}},150)}}catch(e){}};
 const ui=()=>{if(!g("vb"))return;const cs=pc?pc.connectionState:"";const t=!on?"Voice mati":!peer?"Voice nyala. Menunggu pasanganmu ikut menyalakan voice...":cs=="connected"?"Tersambung! Kalian bisa ngobrol sekarang":cs=="failed"?"Gagal tersambung (jaringan menolak). Matikan lalu nyalakan lagi ya":"Menghubungkan...";
  g("vst").textContent=t;g("vb").innerHTML=ic(on?"micoff":"mic")+(on?" Matikan voice":" Nyalakan voice");g("vm").hidden=!on;g("vm").innerHTML=ic(mic?"mic":"micoff")+(mic?" Mic nyala":" Mic mati");g("bvoice").classList.toggle("live",on);
  if(st)[0,1].forEach(i=>g("vp"+i).innerHTML=emo(`<div class="vp ${talk[i]?"talk":""}"><span class=av>${av(i)}</span><small>${N(i)}</small></div>`))};
 const drop=k=>{if(pc){try{pc.close()}catch(e){}pc=null}pcPeer=null;if(!k)ui()};
 const addI=m=>{if(!pc||pc.peer!=m.f)return;if(pc.remoteDescription)pc.addIceCandidate(m.d).catch(()=>{});else pend.push(m)};
 const drain=()=>pend.splice(0).forEach(addI);
 function mk(p){drop(1);pend=[];pc=new RTCPeerConnection(ICE);pc.peer=p;stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>e.candidate&&send("ice",p,e.candidate.toJSON());
  pc.ontrack=e=>{aud.srcObject=e.streams[0];aud.play().catch(()=>{});watch(e.streams[0],1-me)};pc.onconnectionstatechange=()=>{if(pc&&pc.connectionState=="connected"){toast("Voice tersambung!","speaker");SFX.join()}ui()}}
 async function call(){mk(peer);pcPeer=peer;const o=await pc.createOffer();await pc.setLocalDescription(o);send("offer",peer,pc.localDescription.toJSON())}
 async function onOffer(m){mk(m.f);await pc.setRemoteDescription(m.d);drain();const a=await pc.createAnswer();await pc.setLocalDescription(a);send("answer",m.f,pc.localDescription.toJSON())}
 async function tick(){if(busy||!on)return;busy=1;try{const l=await api("GET",null,"&act=sig&slot="+(1-me));
  for(const m of l){if(seen.has(m.i))continue;seen.add(m.i);
   if(m.t=="join")peer=m.f;else if(m.t=="bye"){if(m.f==peer)peer=null}
   else if(m.to==sid){if(m.t=="offer")await onOffer(m);else if(m.t=="answer"){if(pc&&pc.peer==m.f&&!pc.remoteDescription){await pc.setRemoteDescription(m.d);drain()}}else if(m.t=="ice")addI(m)}}
  if(me==0&&peer&&peer!==pcPeer)await call();
  if(!peer&&pc){drop();toast("Pasangan menutup voice","mic")}
  ui()}catch(e){}busy=0}
 async function start(){if(!st||local||!room)return;if(!navigator.mediaDevices||!window.RTCPeerConnection){toast("Browser ini belum mendukung voice","mic");return}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}catch(e){toast("Izin mic ditolak atau mic tidak ada","micoff");return}
  on=true;mic=true;sid=Date.now()+"-"+rnd(1e6);out=[];n=0;seen=new Set();peer=null;pend=[];
  aud=aud||Object.assign(new Audio(),{autoplay:true});aud.volume=+(ls("ldr_vv")??1);send("join");watch(stream,me);tmr=setInterval(tick,1000);SFX.voice(1);ui();tick()}
 async function stop(){if(!on)return;on=false;clearInterval(tmr);out.push({i:sid+".bye",t:"bye",f:sid});await flush();drop(1);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;stopW(0);stopW(1);talk=[0,0];SFX.voice(0);ui()}
 return{ui,stop,tog:()=>on?stop():start(),mute(){mic=!mic;if(stream)stream.getAudioTracks().forEach(t=>t.enabled=mic);ui()},vol(v){ls("ldr_vv",v);if(aud)aud.volume=v}}})();

function genSnake(){const used=new Set([1,36]),sn={},ld={};
 const pick=(lo,hi)=>{let n;do n=lo+rnd(hi-lo+1);while(used.has(n));used.add(n);return n};
 for(let i=0;i<4;i++){const a=pick(2,28);ld[a]=pick(a+5,35)}
 for(let i=0;i<4;i++){const a=pick(10,35);sn[a]=pick(2,a-5)}
 return{sn,ld,sq:[...Array(6)].map(()=>pick(2,35))}}

function genTiles(){const ps=shuf(PP).slice(0,9).map(([e,n])=>({e,n,p:60+20*rnd(9),t:"p"}));
 const sp=[...Array(4)].map(()=>({e:"💌",n:"Kartu Tanya",p:0,t:"q"})).concat([{e:"🧾",n:"Pajak -50",p:0,t:"t"},{e:"🎁",n:"Bonus +50",p:0,t:"b"}]);
 return[{e:"🏁",n:"START",p:0,t:"s"},...shuf(ps.concat(sp))]}

 const h=R(360),c=`hsl(${h},85%,68%)`,d=`hsl(${h},60%,35%)`,a=`hsl(${(h+150)%360},90%,62%)`,k=`stroke='${d}' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'`;
 const top=[`<path d='M22 36L16 8L42 26ZM78 36L84 8L58 26Z' fill='${a}' ${k}/>`,`<path d='M50 24V8' fill='none' ${k}/><circle cx='50' cy='7' r='6' fill='${a}' ${k}/>`,`<circle cx='20' cy='32' r='11' fill='${a}' ${k}/><circle cx='80' cy='32' r='11' fill='${a}' ${k}/>`,`<path d='M28 30L34 8L44 24L50 4L56 24L66 8L72 30Z' fill='${a}' ${k}/>`][R(4)];
 const body=[`<circle cx='50' cy='56' r='36' fill='${c}' ${k}/>`,`<rect x='14' y='22' width='72' height='70' rx='28' fill='${c}' ${k}/>`,`<ellipse cx='50' cy='58' rx='39' ry='32' fill='${c}' ${k}/>`][R(3)];
 const n=1+R(3),r=n==1?13:9;let e="";for(let i=0;i<n;i++){const cx=n==1?50:n==2?39+i*22:30+i*20;e+=`<circle cx='${cx}' cy='46' r='${r}' fill='#fff' ${k}/><circle cx='${cx+R(3)-1}' cy='47' r='${r/2.3}' fill='#2b1d3a'/>`}
 const m=[`<path d='M36 66Q50 82 64 66' fill='none' ${k}/>`,`<path d='M36 66Q50 92 64 66Z' fill='#7a2a4a' ${k}/><rect x='45' y='66' width='10' height='8' fill='#fff'/>`,`<path d='M34 70Q42 60 50 70Q58 60 66 70' fill='none' ${k}/>`][R(3)];
 return `<svg class='mon${big?" big":""}' viewBox='0 0 100 100'>${top}${body}<circle cx='24' cy='64' r='6' fill='#ff8fb1' opacity='.6'/><circle cx='76' cy='64' r='6' fill='#ff8fb1' opacity='.6'/>${e}${m}</svg>`}

function mroll(){if(!can()||st.buy!=null)return;roll(d=>{const t=st.turn,o=st.p[t],n=(o+d)%16,x=st.tl[n],ow=st.own[n];st.d=d;st.p[t]=n;st.msg=`${N(t)} dapat ${d}`;
 if(n<o){st.cash[t]+=200;st.msg+=" · lewat START +$200"}
 if(x.t=="p"){if(ow==null){st.buy=n;return commit()}if(ow!=t){const r=Math.round(x.p*.3);st.cash[t]-=r;st.cash[ow]+=r;st.msg+=` · bayar sewa $${r}`}}
 else if(x.t=="q")qask();else if(x.t=="t")st.cash[t]-=50;else if(x.t=="b")st.cash[t]+=50;
 nextT()})}
function buy(y){const t=st.turn,b=st.buy;if(y&&st.cash[t]>=st.tl[b].p){st.cash[t]-=st.tl[b].p;st.own[b]=t;st.msg=`${N(t)} beli ${st.tl[b].n} 🏠`}st.buy=null;nextT()}
function fin(){const w=[0,1].map(i=>st.cash[i]+Object.keys(st.own).filter(k=>st.own[k]==i).reduce((s,k)=>s+st.tl[k].p,0));win(w[0]>=w[1]?0:1)}

/* ---------- UNO ---------- */
const CL={r:"#ff6b8b",y:"#ffb800",g:"#3fc79a",b:"#5aa9f0",w:"#3b2a4a"};
function initUno(){const d=[];for(const c of"rygb"){for(let v=1;v<=9;v++)d.push({c,v:""+v},{c,v:""+v});d.push({c,v:"S"},{c,v:"S"},{c,v:"+2"},{c,v:"+2"})}
 for(let i=0;i<4;i++)d.push({c:"w",v:"W"},{c:"w",v:"+4"});
 d.sort(()=>Math.random()-.5);st.h=[d.splice(0,7),d.splice(0,7)];let t;do{t=d.pop();if(t.c=="w")d.unshift(t)}while(t.c=="w");st.top=t;st.col=t.c;st.dk=d;st.wild=0}
const ok=x=>x.c=="w"||x.c==st.col||x.v==st.top.v;
const dr=(p,n)=>{while(n--)st.h[p].push(st.dk.length?st.dk.pop():{c:"rygb"[rnd(4)],v:""+(1+rnd(9))})};
function uno(){const v=local?st.turn:me,my=can(),o=1-v;
 const cd=(x,k,f)=>`<div class="uc ${k}" style="background:${CL[x.c]}" ${f||""}>${x.v=="S"?"⛔":x.v=="W"?"🌈":x.v}</div>`;
 const pick=st.wild&&my?`<div class=row><span>Pilih warna:</span>${[..."rygb"].map(c=>`<button style="background:${CL[c]}" onclick="wild('${c}')">●</button>`).join("")}</div>`:"";
 return `<div class="box tb"><div>${local?"Kartu lawan disembunyikan, oper HP tiap giliran 🙈":`${E[o]} ${N(o)}: ${st.h[o].length} kartu`}</div>
 <div class=row><div class="uc back" onclick="drw()">🂠<br>ambil</div>${cd(st.top,"")}<span class=dot style="background:${CL[st.col]}"></span></div></div>`
 +turnbar(pick)+`<div class=hand>${st.h[v].map((x,i)=>cd(x,my&&!st.wild&&ok(x)?"":"off",`onclick="play(${i})"`)).join("")}</div><p class=hint>⛔ skip + kartu pertanyaan · 🌈 ganti warna</p>`}
function play(i){if(!can()||st.wild)return;const t=st.turn,x=st.h[t][i];if(!ok(x))return;st.h[t].splice(i,1);st.top=x;
 if(!st.h[t].length)return win(t);
 if(x.c=="w"){st.wild=1;return commit()}
 st.col=x.c;eff(x)}
function wild(c){st.col=c;st.wild=0;eff(st.top)}
function eff(x){const t=st.turn,o=1-t;st.msg=`${N(t)} main ${x.v}`;
 if(x.v=="+2")dr(o,2);else if(x.v=="+4")dr(o,4);else if(x.v=="S")qask();
 if(!["S","+2","+4"].includes(x.v))st.turn=o;
 if(st.h[t].length==1)st.msg+=" · UNO! 🔔";
 commit()}
function drw(){if(!can()||st.wild)return;dr(st.turn,1);st.msg=`${N(st.turn)} ambil kartu`;st.turn=1-st.turn;commit()}

/* ---------- RENDER ---------- */
function render(){
 ["bchat","bvoice"].forEach(i=>document.getElementById(i).style.display=!st||local?"none":"");
 if(!st){$.innerHTML=emo(prof?home():profile());return}
 let h=`<div class=box style="display:flex;justify-content:space-between;padding:8px 12px"><span>${local?"📱 1 HP":"🔑 "+room} <button onclick="out()" style="padding:2px 8px;font-size:.8rem">🚪 Keluar</button></span><span>${E[0]} ${N(0)} · ${E[1]} ${N(1)}</span></div>`;
 h+=st.g=="menu"?menu():st.g=="snake"?snake():st.g=="mono"?mono():uno();
 h+=`<div class=row style="margin-top:14px">${st.g!="menu"?`<button onclick="go('menu')">🏠 Menu</button>`:""}${["kiss","laugh","plead","angry","heart"].map(n=>`<button onclick="react('${n}')">${ic(n)}</button>`).join("")}</div>`;
 if(st.q!=null)h+=qcard(st.q);
 if(st.win!=null)h+=winbox();
 $.innerHTML=emo(h);
 if(st.rx&&st.rx.id!=seenRx){seenRx=st.rx.id;fl(st.rx.e)}
 if(st.q!=null&&st.q!==pq)SFX.card();pq=st.q;
 if(st.win!=null&&pwn==null){SFX.win();fl("🎉");fl("🏆")}pwn=st.win;
 const sig=JSON.stringify([st.g,st.p,st.top,st.own,st.cash]);
 if(psig&&sig!==psig&&st.g!="menu"){if(/ular/.test(st.msg))SFX.down();else if(/tangga/.test(st.msg))SFX.up();else if(/beli/.test(st.msg))SFX.coin();else SFX.step()}psig=sig;
 if(!local&&st.g!="menu"&&st.turn===me&&pt!==me&&st.q==null&&st.win==null)SFX.turn();pt=st.turn;
 const cnt=(st.pl[0]?1:0)+(st.pl[1]?1:0);if(!local&&pn==1&&cnt==2){SFX.join();toast(N(1-me)+" masuk ke room!","heart")}pn=cnt;
 VC.ui();
}
syncSnd();
document.addEventListener("click",e=>{SFX.unlock();if(e.target.closest("button"))SFX.pop()});initBg();
addEventListener("pointermove",e=>{const r=document.documentElement.style;r.setProperty("--ry",((e.clientX/innerWidth-.5)*12)+"deg");r.setProperty("--rx",(-(e.clientY/innerHeight-.5)*8)+"deg")});
prof=ls("ldr_prof");const ses=ls("ldr_ses");
if(ses&&prof){room=ses.room;pw=ses.pw;me=ses.me;api("GET").then(r=>{adoptChat(r.chat);delete r.chat;st=r;render()}).catch(()=>{room="";pw="";ls("ldr_ses",null);render()})}
render();
</script></body></html>
