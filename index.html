const SFX=(()=>{let ac,vol=+(ls("ldr_vol")??.6),mute=!!ls("ldr_mute");
 const tone=(f,t=.12,type="sine",at=0,g=1,sl)=>{if(mute||vol<=0)return;try{const c=ac||(ac=new(window.AudioContext||window.webkitAudioContext)());if(c.state=="suspended")c.resume();
  const o=c.createOscillator(),n=c.createGain(),s=c.currentTime+at;o.type=type;o.frequency.setValueAtTime(f,s);if(sl)o.frequency.exponentialRampToValueAtTime(sl,s+t);
  n.gain.setValueAtTime(.0001,s);n.gain.exponentialRampToValueAtTime(.3*vol*g,s+.01);n.gain.exponentialRampToValueAtTime(.0001,s+t);o.connect(n);n.connect(c.destination);o.start(s);o.stop(s+t+.02)}catch(e){}};

function genSnake(){const used=new Set([1,36]),sn={},ld={};
 const pick=(lo,hi)=>{let n;do n=lo+rnd(hi-lo+1);while(used.has(n));used.add(n);return n};

const ADJ=["Gemoy","Mungil","Kocak","Ngantuk","Galak","Imut","Ceria","Baper","Lemot","Jago"],NOUN=["Bakpao","Boba","Mochi","Puding","Cilok","Donat","Seblak","Cireng","Kroket","Bolu"];
const rname=()=>NOUN[rnd(10)]+ADJ[rnd(10)]+rnd(100);
function mon(s,big){let x=s>>>0;const R=n=>(x=(x*1664525+1013904223)>>>0,(x>>>8)%n);
 const h=R(360),c=`hsl(${h},85%,68%)`,d=`hsl(${h},60%,35%)`,a=`hsl(${(h+150)%360},90%,62%)`,k=`stroke='${d}' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'`;
 const top=[`<path d='M22 36L16 8L42 26ZM78 36L84 8L58 26Z' fill='${a}' ${k}/>`,`<path d='M50 24V8' fill='none' ${k}/><circle cx='50' cy='7' r='6' fill='${a}' ${k}/>`,`<circle cx='20' cy='32' r='11' fill='${a}' ${k}/><circle cx='80' cy='32' r='11' fill='${a}' ${k}/>`,`<path d='M28 30L34 8L44 24L50 4L56 24L66 8L72 30Z' fill='${a}' ${k}/>`][R(4)];
 const body=[`<circle cx='50' cy='56' r='36' fill='${c}' ${k}/>`,`<rect x='14' y='22' width='72' height='70' rx='28' fill='${c}' ${k}/>`,`<ellipse cx='50' cy='58' rx='39' ry='32' fill='${c}' ${k}/>`][R(3)];
 const n=1+R(3),r=n==1?13:9;let e="";for(let i=0;i<n;i++){const cx=n==1?50:n==2?39+i*22:30+i*20;e+=`<circle cx='${cx}' cy='46' r='${r}' fill='#fff' ${k}/><circle cx='${cx+R(3)-1}' cy='47' r='${r/2.3}' fill='#2b1d3a'/>`}
 const m=[`<path d='M36 66Q50 82 64 66' fill='none' ${k}/>`,`<path d='M36 66Q50 92 64 66Z' fill='#7a2a4a' ${k}/><rect x='45' y='66' width='10' height='8' fill='#fff'/>`,`<path d='M34 70Q42 60 50 70Q58 60 66 70' fill='none' ${k}/>`][R(3)];
 return `<svg class='mon${big?" big":""}' viewBox='0 0 100 100'>${top}${body}<circle cx='24' cy='64' r='6' fill='#ff8fb1' opacity='.6'/><circle cx='76' cy='64' r='6' fill='#ff8fb1' opacity='.6'/>${e}${m}</svg>`}
const av=i=>st&&st.pl[i]?mon(st.pl[i].a):"👻";
const N=i=>st&&st.pl[i]?esc(st.pl[i].n):"Menunggu pasangan...";
const E={get 0(){return av(0)},get 1(){return av(1)}};

/* ---------- ROOM & SINKRONISASI ---------- */
const fresh=()=>({v:0,g:"menu",turn:0,pl:[prof,null],used:[],q:null,msg:"",rx:null,win:null});
const api=async(m,b,q="")=>{const r=await fetch("/api?room="+room+q,{method:m,headers:{"x-pw":encodeURIComponent(pw)},body:b?JSON.stringify(b):undefined});if(!r.ok)throw r.status;return r.json()};
async function commit(){st.v++;render();if(!local){try{await api("POST",st)}catch(e){}}}
function kick(m){chat=[];seenC=0;rc();st=null;room="";pw="";local=false;ls("ldr_ses",null);err=m||"";render()}
setInterval(async()=>{if(local||!room||!st)return;try{const r=await api("GET");if(r){adoptChat(r.chat);delete r.chat}if(r&&r.v>st.v){st=r;render()}}catch(e){if(e===404||e===403)kick("Room sudah ditutup atau dihapus 🗑️")}},1500);
setInterval(()=>{if(!local&&room&&st)api("POST",null,"&act=ping").catch(()=>{})},30000);
const can=()=>(local||me===st.turn)&&st.q==null&&st.win==null;

/* ---------- PROFIL ---------- */
const profile=()=>{tmp=tmp||{n:rname(),a:rnd(1e6)};return `<h1><span class=wig>👾</span> Kenalan dulu yuk!</h1>
<div class=box style="text-align:center"><p>Ini monster kamu:</p>${mon(tmp.a,1)}
<div class=row><button class=bl onclick="tmp.a=rnd(1e6);render()">🎲 Monster baru</button></div>
<input id=un value="${tmp.n}" maxlength=14 placeholder="Username kamu" oninput="tmp.n=esc(this.value)">
<div class=row><button class=mn onclick="tmp.n=rname();render()">🎲 Nama acak</button><button class=pk onclick="saveP()">Lanjut 💕</button></div></div>`};
function saveP(){if(!tmp.n.trim())tmp.n=rname();prof={n:tmp.n.trim(),a:tmp.a};tmp=null;ls("ldr_prof",prof);render()}
function ed(){tmp={...prof};prof=null;render()}

/* ---------- HOME ---------- */
const home=()=>`<h1><span class=wig>💕</span> LDR Game Night <span class=wig>🎲</span></h1>
<div class=box style="text-align:center">${mon(prof.a,1)}<div><b>${esc(prof.n)}</b></div><button onclick="ed()" style="padding:4px 10px;font-size:.8rem">✏️ Ganti profil</button></div>
<div class=box><b>Buat room</b><input id=pw1 type=password placeholder="Password room (min. 3 karakter)">
<button class=pk onclick="mk()" style="width:100%;margin-top:6px">✨ Buat room baru</button>
<hr><b>Gabung room</b><input id=cd placeholder="Kode room" maxlength=6 style="text-transform:uppercase"><input id=pw2 type=password placeholder="Password room">
<button class=mn onclick="jn()" style="width:100%;margin-top:6px">💌 Gabung</button>
<hr><button class=bl onclick="lc()" style="width:100%">📱 Main berdua di 1 HP</button><p>${err}</p></div>`;
async function mk(){const p=document.getElementById("pw1").value;if(p.length<3){err="Password minimal 3 karakter 🔑";return render()}
 pw=p;local=false;me=0;st=fresh();chat=[];seenC=0;rc();
 for(let i=0;i<5;i++){room=[...Array(4)].map(()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[rnd(24)]).join("");
  try{await api("POST",st,"&act=create");err="";ls("ldr_ses",{room,pw,me});return render()}catch(e){if(e!==409)break}}
 room="";pw="";st=null;err="Gagal bikin room, coba lagi ya 🥲";render()}
async function jn(){room=document.getElementById("cd").value.trim().toUpperCase();pw=document.getElementById("pw2").value;
 if(!room||!pw){err="Isi kode & password dulu ya";return render()}
 try{const r=await api("GET"),i=r.pl[0]?r.pl[1]?-1:1:0;if(i<0){room="";pw="";err="Room sudah penuh 🙈";return render()}
  st=r;me=i;chat=[];seenC=0;adoptChat(r.chat);delete st.chat;seenC=chat.length;local=false;st.pl[i]=prof;err="";ls("ldr_ses",{room,pw,me});commit()}
 catch(e){st=null;room="";err=e===403?"Password salah 🔒":e===404?"Room nggak ketemu 🥲":"Koneksi bermasalah, coba lagi";pw="";render()}}
function lc(){local=true;room="";st=fresh();st.pl[1]={n:rname(),a:rnd(1e6)};render()}
async function out(){if(!confirm("Keluar dari room?"))return;if(!local){try{await api("POST",null,"&act=leave&slot="+me)}catch(e){}}kick("")}

/* ---------- COMMON ---------- */
const turnbar=x=>`<div class="box tb">${st.msg?`<div>${st.msg}</div>`:""}<b>${E[st.turn]} Giliran ${N(st.turn)}${can()&&!local?" (kamu!) ✨":""}</b><div class=row>${x}</div></div>`;
const qcard=i=>`<div class=md><div class=qc><div class=qh>💕 COUPLE CARD GAME 💕</div><div class=qs>100 Questions to Know Each Other Deeper</div><span class=qn>#${i+1}</span><p class=id>${Q[i][0]}</p><p class=en>${Q[i][1]}</p><button class=pk onclick="st.q=null;commit()">Udah dijawab ✔️</button></div></div>`;
const winbox=()=>`<div class=md><div class=qc><h1>🎉🏆🎉</h1><h2>${N(st.win)} menang!</h2><p>Yang kalah traktir boba ya 🧋</p><button class=pk onclick="go('menu')">Balik ke menu</button></div></div>`;
function qask(){let l=Q.map((_,i)=>i).filter(i=>!st.used.includes(i));if(!l.length){st.used=[];l=Q.map((_,i)=>i)}const i=l[rnd(l.length)];st.used.push(i);st.q=i}
function ask(){qask();commit()}
function win(t){st.win=t;commit()}
function roll(fn){if(rolling)return;rolling=true;let n=0;const iv=setInterval(()=>{const d=document.getElementById("dc");if(d)d.textContent=DI[rnd(6)];if(++n>8){clearInterval(iv);rolling=false;fn(1+rnd(6))}},70)}
function react(e){st.rx={e,id:Date.now()};commit()}
function fl(e){SFX.boing();for(let i=0;i<8;i++){const s=document.createElement("span");s.textContent=e;s.className="fl";s.style.left=10+rnd(80)+"%";s.style.animationDelay=i*.1+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}}
function go(g){st.g=g;st.turn=rnd(2);st.hue=rnd(360);st.win=null;st.q=null;st.msg="";
 if(g=="snake"){Object.assign(st,genSnake());st.p=[1,1]}
 if(g=="mono"){st.p=[0,0];st.cash=[1000,1000];st.own={};st.buy=null;st.tl=genTiles()}
 if(g=="uno")initUno();
 commit()}
const menu=()=>{const w=!local&&!(st.pl[0]&&st.pl[1]),d=w?"disabled":"";return `<h1 style="font-size:1.6rem">Mau main apa hari ini?</h1><div class=grid2>
<button class="gm pk" ${d} onclick="go('snake')">🐍🪜<br>Ular Tangga</button>
<button class="gm mn" ${d} onclick="go('mono')">🏠💰<br>Monopoli Mini</button>
<button class="gm bl" ${d} onclick="go('uno')">🃏<br>UNO</button>
<button class=gm ${d} onclick="ask()">💌<br>Couple Card</button></div>
<p class=hint>${w?"⏳ Menunggu pasanganmu masuk. Kasih tahu kode <b>"+room+"</b> dan password-nya ya 💞":local?"Mode 1 HP: gantian pegang ya 🤝":"Kode room: <b>"+room+"</b> 💞"}</p>`};

/* ---------- ULAR TANGGA ---------- */
function snake(){let c="";for(let r=5;r>=0;r--)for(let k=0;k<6;k++){const n=r*6+(r%2?6-k:k+1);
 const e=st.sn[n]?"🐍":st.ld[n]?"🪜":st.sq.includes(n)?"💌":n==36?"🏆":"";
 const bg=st.sn[n]?"#ffd0d9":st.ld[n]?"#c9f5e6":st.sq.includes(n)?"#fff1b8":"hsl("+st.hue+",90%,95%)";
 c+=`<div class=c style="background:${bg}"><b>${n}</b><span class=e>${e}</span>${st.p.map((p,i)=>p==n?`<span class="pw p${i}">${E[i]}</span>`:"").join("")}</div>`}
 return `<div class=stage><div class=sb>${c}</div></div>`+turnbar(`${dice(st.d||1)}<button class=pk ${can()?"":"disabled"} onclick="sroll()">Kocok dadu 🎲</button>`)+`<p class=hint>🐍 turun · 🪜 naik · 💌 kartu pertanyaan</p>`}
function sroll(){if(!can())return;roll(d=>{const t=st.turn;let p=st.p[t]+d;st.d=d;if(p>36)p=72-p;
 st.msg=`${N(t)} dapat ${d}`;
 if(p==36){st.p[t]=36;return win(t)}
 if(st.sn[p]){p=st.sn[p];st.msg+=" · 🐍 digigit ular!"}else if(st.ld[p]){p=st.ld[p];st.msg+=" · 🪜 naik tangga!"}
 st.p[t]=p;st.turn=1-t;if(st.sq.includes(p))qask();commit()})}

/* ---------- MONOPOLI ---------- */
const POS=i=>i<5?[1,i+1]:i<8?[i-3,5]:i<13?[5,13-i]:[17-i,1];
function mono(){const c=st.tl.map((t,i)=>{const[r,k]=POS(i),o=st.own[i];
 return `<div class=mc style="grid-area:${r}/${k};background:${o!=null?(o?"#ffd0d9":"#cfeaff"):"hsl("+st.hue+",90%,95%)"}"><span>${t.e}</span><small>${t.n}</small>${t.p?`<small>${o!=null?E[o]:"$"+t.p}</small>`:""}${st.p.map((p,j)=>p==i?`<span class="pw p${j}">${E[j]}</span>`:"").join("")}</div>`}).join("");
 const b=st.buy,ui=b!=null?(can()?`<div>Beli ${st.tl[b].n} $${st.tl[b].p}?</div><div class=row><button class=mn onclick="buy(1)">Beli 🏠</button><button onclick="buy(0)">Skip</button></div>`:"<div>Lagi mikir mau beli... 🤔</div>"):`<button class=pk ${can()?"":"disabled"} onclick="mroll()">Kocok 🎲</button>`;
 return `<div class=stage><div class=mb>${c}<div class=mid>${st.cash.map((n,i)=>`<div>${E[i]} $${st.cash[i]}</div>`).join("")}${dice(st.d||1)}${ui}</div></div></div>`+turnbar(`<button onclick="fin()">Akhiri game</button>`)+`<p class=hint>Lewat START +$200 · sewa = 30% harga</p>`}
function nextT(){if(st.cash[st.turn]<0)return win(1-st.turn);st.turn=1-st.turn;commit()}
function mroll(){if(!can()||st.buy!=null)return;roll(d=>{const t=st.turn,o=st.p[t],n=(o+d)%16,x=st.tl[n],ow=st.own[n];st.d=d;st.p[t]=n;st.msg=`${N(t)} dapat ${d}`;
 if(n<o){st.cash[t]+=200;st.msg+=" · lewat START +$200"}
 if(x.t=="p"){if(ow==null){st.buy=n;return commit()}if(ow!=t){const r=Math.round(x.p*.3);st.cash[t]-=r;st.cash[ow]+=r;st.msg+=` · bayar sewa $${r}`}}
 else if(x.t=="q")qask();else if(x.t=="t")st.cash[t]-=50;else if(x.t=="b")st.cash[t]+=50;
 nextT()})}
function buy(y){const t=st.turn,b=st.buy;if(y&&st.cash[t]>=st.tl[b].p){st.cash[t]-=st.tl[b].p;st.own[b]=t;st.msg=`${N(t)} beli ${st.tl[b].n} 🏠`}st.buy=null;nextT()}
function fin(){const w=[0,1].map(i=>st.cash[i]+Object.keys(st.own).filter(k=>st.own[k]==i).reduce((s,k)=>s+st.tl[k].p,0));win(w[0]>=w[1]?0:1)}

/* ---------- UNO ---------- */
const CL={r:"#ff6b8b",y:"#ffb800",g:"#3fc79a",b:"#5aa9f0",w:"#3b2a4a"};
function initUno(){const d=[];for(const c of"rygb"){for(let v=1;v<=9;v++)d.push({c,v:""+v},{c,v:""+v});d.push({c,v:"S"},{c,v:"S"},{c,v:"+2"},{c,v:"+2"})}
 for(let i=0;i<4;i++)d.push({c:"w",v:"W"},{c:"w",v:"+4"});
 d.sort(()=>Math.random()-.5);st.h=[d.splice(0,7),d.splice(0,7)];let t;do{t=d.pop();if(t.c=="w")d.unshift(t)}while(t.c=="w");st.top=t;st.col=t.c;st.dk=d;st.wild=0}
const ok=x=>x.c=="w"||x.c==st.col||x.v==st.top.v;
const dr=(p,n)=>{while(n--)st.h[p].push(st.dk.length?st.dk.pop():{c:"rygb"[rnd(4)],v:""+(1+rnd(9))})};
function uno(){const v=local?st.turn:me,my=can(),o=1-v;
 const cd=(x,k,f)=>`<div class="uc ${k}" style="background:${CL[x.c]}" ${f||""}>${x.v=="S"?"⛔":x.v=="W"?"🌈":x.v}</div>`;
 const pick=st.wild&&my?`<div class=row><span>Pilih warna:</span>${[..."rygb"].map(c=>`<button style="background:${CL[c]}" onclick="wild('${c}')">●</button>`).join("")}</div>`:"";
 return `<div class="box tb"><div>${local?"Kartu lawan disembunyikan, oper HP tiap giliran 🙈":`${E[o]} ${N(o)}: ${st.h[o].length} kartu`}</div>
 <div class=row><div class="uc back" onclick="drw()">🂠<br>ambil</div>${cd(st.top,"")}<span class=dot style="background:${CL[st.col]}"></span></div></div>`
 +turnbar(pick)+`<div class=hand>${st.h[v].map((x,i)=>cd(x,my&&!st.wild&&ok(x)?"":"off",`onclick="play(${i})"`)).join("")}</div><p class=hint>⛔ skip + kartu pertanyaan · 🌈 ganti warna</p>`}
function play(i){if(!can()||st.wild)return;const t=st.turn,x=st.h[t][i];if(!ok(x))return;st.h[t].splice(i,1);st.top=x;
 if(!st.h[t].length)return win(t);
 if(x.c=="w"){st.wild=1;return commit()}
 st.col=x.c;eff(x)}
function wild(c){st.col=c;st.wild=0;eff(st.top)}
function eff(x){const t=st.turn,o=1-t;st.msg=`${N(t)} main ${x.v}`;
 if(x.v=="+2")dr(o,2);else if(x.v=="+4")dr(o,4);else if(x.v=="S")qask();
 if(!["S","+2","+4"].includes(x.v))st.turn=o;
 if(st.h[t].length==1)st.msg+=" · UNO! 🔔";
 commit()}
function drw(){if(!can()||st.wild)return;dr(st.turn,1);st.msg=`${N(st.turn)} ambil kartu`;st.turn=1-st.turn;commit()}

/* ---------- RENDER ---------- */
function render(){
 document.getElementById("bchat").style.display=!st||local?"none":"";
 if(!st){$.innerHTML=prof?home():profile();return}
 let h=`<div class=box style="display:flex;justify-content:space-between;padding:8px 12px"><span>${local?"📱 1 HP":"🔑 "+room} <button onclick="out()" style="padding:2px 8px;font-size:.8rem">🚪 Keluar</button></span><span>${E[0]} ${N(0)} · ${E[1]} ${N(1)}</span></div>`;
 h+=st.g=="menu"?menu():st.g=="snake"?snake():st.g=="mono"?mono():uno();
 h+=`<div class=row style="margin-top:14px">${st.g!="menu"?`<button onclick="go('menu')">🏠 Menu</button>`:""}${["😘","😂","🥺","😡","❤️"].map(e=>`<button onclick="react('${e}')">${e}</button>`).join("")}</div>`;
 if(st.q!=null)h+=qcard(st.q);
 if(st.win!=null)h+=winbox();
 $.innerHTML=h;
 if(st.rx&&st.rx.id!=seenRx){seenRx=st.rx.id;fl(st.rx.e)}
 if(st.q!=null&&st.q!==pq)SFX.card();pq=st.q;
 if(st.win!=null&&pwn==null){SFX.win();fl("🎉");fl("🏆")}pwn=st.win;
 const sig=JSON.stringify([st.g,st.p,st.top,st.own,st.cash]);
 if(psig&&sig!==psig&&st.g!="menu"){if(/ular/.test(st.msg))SFX.down();else if(/tangga/.test(st.msg))SFX.up();else if(/beli/.test(st.msg))SFX.coin();else SFX.step()}psig=sig;
}
syncSnd();
document.addEventListener("click",e=>{if(e.target.closest("button"))SFX.pop()});
addEventListener("pointermove",e=>{const r=document.documentElement.style;r.setProperty("--ry",((e.clientX/innerWidth-.5)*12)+"deg");r.setProperty("--rx",(-(e.clientY/innerHeight-.5)*8)+"deg")});
prof=ls("ldr_prof");const ses=ls("ldr_ses");
if(ses&&prof){room=ses.room;pw=ses.pw;me=ses.me;api("GET").then(r=>{adoptChat(r.chat);delete r.chat;st=r;render()}).catch(()=>{room="";pw="";ls("ldr_ses",null);render()})}
render();
</script></body></html>
